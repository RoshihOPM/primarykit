[project]
name = "primarykit"
version = "0.1.0"
description = "Reusable Django starter and application catalog"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "django>=6.1,<6.2",
  "djangorestframework>=3.18,<4",
  "psycopg[binary]>=3.2,<4",
  "django-environ>=0.12,<1",
  "django-cors-headers>=4.7,<5",
  "drf-spectacular>=0.29,<1",
  "djangorestframework-simplejwt>=5.5,<6",
  "gunicorn>=23,<24",
  "django-storages[s3]>=1.14,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.9,<5",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
