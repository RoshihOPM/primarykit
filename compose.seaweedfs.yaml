# Opt-in, single-node SeaweedFS. Only accessible inside the Compose network.
# Development: docker compose -f compose.yaml -f compose.seaweedfs.yaml up -d --build
# Production:  docker compose -f compose.prod.yaml -f compose.seaweedfs.yaml up -d --build
services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.48}
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    expose:
      - "8333"
    volumes:
      - seaweedfs_data:/data

  api:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_ADDRESSING_STYLE: path
      # HTTP only for this private container-to-container connection.
      S3_ALLOW_INSECURE_ENDPOINT: "true"
    depends_on:
      seaweedfs:
        condition: service_started

volumes:
  seaweedfs_data:
