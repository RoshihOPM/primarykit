name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public pull requests must never receive write-capable GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Offline detached-project doctor
        run: uv run python -m apps.core.doctor --strict
      - name: CLI preset dry-run
        run: |
          uv run python scripts/new_project.py --list-presets
          uv run python scripts/new_project.py /tmp/preset-preview --name preview-backend --preset marketplace --dry-run
          test ! -e /tmp/preset-preview
      - name: AI agent context smoke
        run: |
          uv run python -m apps.core.agent_context --format json > /tmp/primarykit-context.json
          uv run python -c 'import json; m=json.load(open("/tmp/primarykit-context.json")); assert "core" in m["modules"] and "users" in m["modules"]'
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate project-specific migrations for tests
        run: uv run python manage.py makemigrations $(uv run python -m apps.core.migration_plan) --noinput --settings=config.settings.test
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Full Django source coverage (SQLite)
        run: |
          uv run --with 'pytest-cov==7.1.0' pytest -q \
            --cov=apps --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-all.xml
      - name: Upload Django source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-source-coverage
          path: coverage-all.xml
          if-no-files-found: ignore
          retention-days: 14
      # Source-only SQLite coverage is a guardrail, not PostgreSQL race coverage.
      # The full PostgreSQL suite, including concurrency tests, runs below.
      - name: Commerce coverage floor (orders, sales, payments)
        run: |
          uv run --with 'pytest-cov==7.1.0' pytest -q \
            apps/orders/tests apps/sales/tests apps/payments/tests \
            --cov=apps.orders --cov=apps.sales --cov=apps.payments \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-commerce.xml \
            --cov-fail-under=75
      - name: Audit locked production dependencies (PyPI advisories)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --format requirements.txt --output-file /tmp/primarykit-locked-requirements.txt
          uvx --from 'pip-audit==2.10.1' pip-audit \
            --no-deps --disable-pip \
            --requirement /tmp/primarykit-locked-requirements.txt
      - name: Moderated listing photos and focused branch coverage (Pillow)
        run: |
          uv run --with 'Pillow>=11,<13' --with 'pytest-cov==7.1.0' pytest -q \
            apps/listings/tests/test_media.py \
            --cov=apps.listings.media \
            --cov=apps.listings.media_views \
            --cov=apps.listings.management.commands.purge_listing_media \
            --cov-branch --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-listing-media.xml
      - name: Upload isolated listing media coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-listing-media-coverage
          path: coverage-listing-media.xml
          if-no-files-found: ignore
          retention-days: 14
      # PRIMARYKIT-GENERATOR-SMOKE-START
      - name: Source-specific comparator and smoke configuration tests
        run: |
          uv run pytest -q scripts/tests/test_contract_check.py scripts/tests/test_generated_client_matrix.py scripts/tests/test_migration_lint.py
          uv run python -m apps.core.cli modules list --json
          uv run python -m apps.core.cli new /tmp/demo-crm --preset crm --dry-run
      # PRIMARYKIT-GENERATOR-SMOKE-END
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f compose.seaweedfs.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.seaweedfs.yaml config --quiet
          docker compose -f compose.yaml -f compose.redis.yaml config --quiet
          docker compose -f compose.yaml -f compose.celery.yaml config --quiet
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.celery.prod.yaml config --quiet
      - name: Build Docker development and production images
        run: |
          docker compose build api
          docker build --target production -t primarykit:ci -f docker/Dockerfile .
      - name: PostgreSQL integration smoke test
        run: |
          docker compose up -d
          docker compose exec -T api python manage.py makemigrations $(uv run python -m apps.core.migration_plan) --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py check
          docker compose exec -T api uv run --with 'pytest-cov==7.1.0' pytest -q \
            --ds=config.settings.postgres_test --cov=apps --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:/tmp/coverage-postgres.xml
          docker compose exec -T api cat /tmp/coverage-postgres.xml > coverage-postgres.xml
          docker compose exec -T api uv run --with 'Pillow>=11,<13' --with 'pytest-cov==7.1.0' pytest -q \
            apps/listings/tests/test_media.py --ds=config.settings.postgres_test \
            --cov=apps.listings.media \
            --cov=apps.listings.media_views \
            --cov=apps.listings.management.commands.purge_listing_media \
            --cov-branch --cov-report=term-missing:skip-covered \
            --cov-report=xml:/tmp/coverage-listing-media-postgres.xml
          docker compose exec -T api cat /tmp/coverage-listing-media-postgres.xml > coverage-listing-media-postgres.xml
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health/ready/
      - name: Upload PostgreSQL Django coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-postgres-coverage
          path: coverage-postgres.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload PostgreSQL listing media coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-listing-media-postgres-coverage
          path: coverage-listing-media-postgres.xml
          if-no-files-found: ignore
          retention-days: 14
      # PRIMARYKIT-MIGRATION-LINT-START
      - name: Squawk PostgreSQL migration SQL lint
        run: uv run python scripts/lint_migration_sql.py
      # PRIMARYKIT-MIGRATION-LINT-END
      - name: Optional Redis and RabbitMQ integration tests
        run: |
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml up -d --wait redis rabbitmq
          # Only install optional client packages for this isolated integration step;
          # the base lockfile and generated clients do not depend on them.
          uv pip install "redis>=6.2,<6.5" "celery[redis]>=5.6,<6"
          PRIMARYKIT_INFRA_INTEGRATION=1 \
          REDIS_CACHE_URL=redis://127.0.0.1:6379/14 \
          CELERY_BROKER_URL=amqp://worker:local-worker-only-change-me@127.0.0.1:5672// \
          uv run --no-sync pytest -q apps/cache/tests/test_redis_integration.py apps/rate_limit/tests/test_redis_integration.py apps/celery_tasks/tests/test_broker_integration.py
          # Cache-only client can use redis-py 8.x without Celery Redis-extra constraints.
          PRIMARYKIT_INFRA_INTEGRATION=1 REDIS_CACHE_URL=redis://127.0.0.1:6379/14 uv run --no-sync --with "redis>=8,<9" pytest -q apps/cache/tests/test_redis_integration.py
      - name: SeaweedFS S3 provider integration test
        run: |
          # Docker Hub occasionally times out during CI; retry the pull only.
          for attempt in 1 2 3; do
            if docker compose -f compose.yaml -f compose.seaweedfs.yaml pull seaweedfs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker compose -f compose.yaml -f compose.seaweedfs.yaml up -d --no-build
          docker compose -f compose.yaml -f compose.seaweedfs.yaml exec -T -e PRIMARYKIT_SEAWEEDFS_INTEGRATION=1 api uv run pytest --ds=config.settings.postgres_test apps/storage/tests/test_seaweedfs_integration.py
      - name: Clean containers
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml down -v || true
          docker compose -f compose.yaml -f compose.seaweedfs.yaml down -v || true
          docker compose down -v || true

  # PRIMARYKIT-MATRIX-JOB-START
  generated-clients:
    name: PostgreSQL generated ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [minimal, api_keys, tasks, webhooks, listings, marketplace, commerce, crm, all]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: primarykit
          POSTGRES_PASSWORD: primarykit_ci_only
          POSTGRES_DB: primarykit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primarykit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://primarykit:primarykit_ci_only@127.0.0.1:5432/primarykit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Generate and test detached PostgreSQL client
        run: uv run python scripts/ci_generated_client.py --case ${{ matrix.case }}
  # PRIMARYKIT-MATRIX-JOB-END
