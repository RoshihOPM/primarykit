name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate project-specific migrations for tests
        run: uv run python manage.py makemigrations users --noinput --settings=config.settings.test
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Tests
        run: uv run pytest
