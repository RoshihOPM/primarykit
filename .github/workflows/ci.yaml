name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Bootstrap formatting snapshot
        run: |
          uv run ruff format .
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in [
              "apps/users/tests/test_email_flows.py",
              "apps/users/email_serializers.py",
              "apps/users/urls.py",
              "apps/users/models.py",
              "apps/rbac/tests/test_rbac_api.py",
              "apps/users/authentication.py",
          ]:
              print("FORMATTED_START:" + name)
              print(base64.b64encode(Path(name).read_bytes()).decode())
              print("FORMATTED_END:" + name)
          PY
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate project-specific migrations for tests
        run: uv run python manage.py makemigrations users --noinput --settings=config.settings.test
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Tests
        run: uv run pytest
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet
      - name: Build Docker development and production images
        run: |
          docker compose build api
          docker build --target production -t primarykit:ci -f docker/Dockerfile .
      - name: PostgreSQL integration smoke test
        run: |
          docker compose up -d
          docker compose exec -T api python manage.py makemigrations users --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py check
          docker compose exec -T api uv run pytest --ds=config.settings.postgres_test
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health/ready/
      - name: Clean containers
        if: always()
        run: docker compose down -v || true
