name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Offline detached-project doctor
        run: uv run python -m apps.core.doctor --strict
      - name: CLI preset dry-run
        run: |
          uv run python scripts/new_project.py --list-presets
          uv run python scripts/new_project.py /tmp/preset-preview --name preview-backend --preset marketplace --dry-run
          test ! -e /tmp/preset-preview
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate project-specific migrations for tests
        run: uv run python manage.py makemigrations users audit storage catalog inventory organizations orders sales payments tasks webhooks api_keys idempotency privacy --noinput --settings=config.settings.test
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Tests
        run: uv run pytest
      # PRIMARYKIT-GENERATOR-SMOKE-START
      - name: OpenAPI compatibility comparator tests
        run: uv run pytest -q scripts/tests/test_contract_check.py
      - name: Generated project smoke test
        run: |
          uv run python scripts/new_project.py /tmp/primarykit-client --name client-backend --apps audit
          cd /tmp/primarykit-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users audit --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Privacy requires Tasks and Audit even in generated clients.
          uv run python scripts/new_project.py /tmp/primarykit-privacy-client --name privacy-client --apps privacy
          cd /tmp/primarykit-privacy-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users audit tasks privacy --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest -q apps/privacy/tests
          cd -
          # Check an independent feature-flags project with no external services.
          uv run python scripts/new_project.py /tmp/primarykit-flags-client --name flags-client --apps feature_flags
          cd /tmp/primarykit-flags-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Search is a standalone PostgreSQL-only helper with no migrations.
          uv run python scripts/new_project.py /tmp/primarykit-search-client --name search-client --apps search
          cd /tmp/primarykit-search-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # CSV exchange can be copied alone; no optional infrastructure or migrations.
          uv run python scripts/new_project.py /tmp/primarykit-csv-client --name csv-client --apps csv_exchange
          cd /tmp/primarykit-csv-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # API keys own client-specific migrations and default-denied scopes.
          uv run python scripts/new_project.py /tmp/primarykit-keys-client --name keys-client --apps api_keys
          cd /tmp/primarykit-keys-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users api_keys --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Isolated PostgreSQL-backed command idempotency.
          uv run python scripts/new_project.py /tmp/primarykit-idem-client --name idem-client --apps idempotency
          cd /tmp/primarykit-idem-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users idempotency --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # HTTP integrations have no required broker or database migrations.
          uv run python scripts/new_project.py /tmp/primarykit-http-client --name http-client --apps http_integrations
          cd /tmp/primarykit-http-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Raw copy test: no generator edits or INSTALLED_APPS/URL changes after copying.
          uv run python scripts/new_project.py /tmp/primarykit-copy-client --name copy-client
          cp -a apps/storage /tmp/primarykit-copy-client/apps/
          cd /tmp/primarykit-copy-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users storage --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run python -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.test"); import django; django.setup(); from django.urls import reverse; assert reverse("stored-files-list") == "/api/v1/files/"'
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-storage-client --name storage-client --apps storage
          cd /tmp/primarykit-storage-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users storage --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Actual raw folder-copy smoke from tracked source, without root settings edits.
          uv run python scripts/new_project.py /tmp/primarykit-catalog-copy --name catalog-copy
          git archive HEAD apps/catalog | tar -x -C /tmp/primarykit-catalog-copy
          cd /tmp/primarykit-catalog-copy
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users catalog --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-inventory-copy --name inventory-copy
          git archive HEAD apps/inventory | tar -x -C /tmp/primarykit-inventory-copy
          cd /tmp/primarykit-inventory-copy
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users inventory --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Statistics raw-copy test: copying one folder auto-registers its routes.
          uv run python scripts/new_project.py /tmp/primarykit-statistics-copy --name stats-copy
          git archive HEAD apps/statistics | tar -x -C /tmp/primarykit-statistics-copy
          cd /tmp/primarykit-statistics-copy
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run python -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.test"); import django; django.setup(); from django.urls import reverse; assert reverse("statistics-metrics") == "/api/v1/statistics/"'
          uv run pytest
          cd -
          # Commerce modules must all boot and work when copied independently.
          # Optional infrastructure modules must generate without importing Celery or Redis.
          uv run python scripts/new_project.py /tmp/primarykit-rate-client --name rate-client --apps rate_limit
          cd /tmp/primarykit-rate-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-cache-client --name cache-client --apps cache
          cd /tmp/primarykit-cache-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-celery-client --name celery-client --apps celery_tasks
          cd /tmp/primarykit-celery-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-infra-client --name infra-client --apps cache celery_tasks
          cd /tmp/primarykit-infra-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-observe-client --name observe-client --apps observability
          cd /tmp/primarykit-observe-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-webhook-client --name webhook-client --apps webhooks
          cd /tmp/primarykit-webhook-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users tasks webhooks --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-outbox-client --name outbox-client --apps outbox
          cd /tmp/primarykit-outbox-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users tasks --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-tasks-client --name tasks-client --apps tasks
          cd /tmp/primarykit-tasks-client
          uv sync --locked --all-groups
          uv run python -m apps.core.doctor --strict
          uv run python manage.py makemigrations users tasks --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-orders-client --name orders-client --apps orders
          cd /tmp/primarykit-orders-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users orders --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-sales-client --name sales-client --apps sales
          cd /tmp/primarykit-sales-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users sales --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-payments-client --name payments-client --apps payments
          cd /tmp/primarykit-payments-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users payments --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-commerce-client --name commerce-client --apps orders sales payments statistics
          cd /tmp/primarykit-commerce-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users orders sales payments --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Statistics must work without any optional business module.
          uv run python scripts/new_project.py /tmp/primarykit-statistics-client --name stats-client --apps statistics
          cd /tmp/primarykit-statistics-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          # Verify conditional standalone providers without tenant models.
          uv run python scripts/new_project.py /tmp/primarykit-statistics-inventory --name stats-inventory --apps statistics inventory
          cd /tmp/primarykit-statistics-inventory
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users inventory --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-catalog-client --name catalog-client --apps catalog
          cd /tmp/primarykit-catalog-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users catalog --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-inventory-client --name inventory-client --apps inventory
          cd /tmp/primarykit-inventory-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users inventory --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-tenant-client --name tenant-client --apps inventory catalog organizations
          cd /tmp/primarykit-tenant-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users catalog inventory organizations --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-org-client --name org-client --apps organizations
          cd /tmp/primarykit-org-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users organizations --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
      # PRIMARYKIT-GENERATOR-SMOKE-END
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f compose.seaweedfs.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.seaweedfs.yaml config --quiet
          docker compose -f compose.yaml -f compose.redis.yaml config --quiet
          docker compose -f compose.yaml -f compose.celery.yaml config --quiet
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.celery.prod.yaml config --quiet
      - name: Build Docker development and production images
        run: |
          docker compose build api
          docker build --target production -t primarykit:ci -f docker/Dockerfile .
      - name: PostgreSQL integration smoke test
        run: |
          docker compose up -d
          docker compose exec -T api python manage.py makemigrations users audit storage catalog inventory organizations orders sales payments tasks webhooks api_keys idempotency privacy --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py check
          docker compose exec -T api uv run pytest --ds=config.settings.postgres_test
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health/ready/
      - name: Optional Redis and RabbitMQ integration tests
        run: |
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml up -d --wait redis rabbitmq
          # Only install optional client packages for this isolated integration step;
          # the base lockfile and generated clients do not depend on them.
          uv pip install "redis>=6.2,<6.5" "celery[redis]>=5.6,<6"
          PRIMARYKIT_INFRA_INTEGRATION=1 \
          REDIS_CACHE_URL=redis://127.0.0.1:6379/14 \
          CELERY_BROKER_URL=amqp://worker:local-worker-only-change-me@127.0.0.1:5672// \
          uv run --no-sync pytest -q apps/cache/tests/test_redis_integration.py apps/rate_limit/tests/test_redis_integration.py apps/celery_tasks/tests/test_broker_integration.py
          # Cache-only client can use redis-py 8.x without Celery Redis-extra constraints.
          PRIMARYKIT_INFRA_INTEGRATION=1 REDIS_CACHE_URL=redis://127.0.0.1:6379/14 uv run --no-sync --with "redis>=8,<9" pytest -q apps/cache/tests/test_redis_integration.py
      - name: SeaweedFS S3 provider integration test
        run: |
          # Docker Hub occasionally times out during CI; retry the pull only.
          for attempt in 1 2 3; do
            if docker compose -f compose.yaml -f compose.seaweedfs.yaml pull seaweedfs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker compose -f compose.yaml -f compose.seaweedfs.yaml up -d --no-build
          docker compose -f compose.yaml -f compose.seaweedfs.yaml exec -T -e PRIMARYKIT_SEAWEEDFS_INTEGRATION=1 api uv run pytest --ds=config.settings.postgres_test apps/storage/tests/test_seaweedfs_integration.py
      - name: Clean containers
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.celery.yaml down -v || true
          docker compose -f compose.yaml -f compose.seaweedfs.yaml down -v || true
          docker compose down -v || true
