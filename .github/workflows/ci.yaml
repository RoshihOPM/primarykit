name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate project-specific migrations for tests
        run: uv run python manage.py makemigrations users audit storage catalog inventory organizations --noinput --settings=config.settings.test
      - name: Django checks
        run: uv run python manage.py check --settings=config.settings.test
      - name: Tests
        run: uv run pytest
      # PRIMARYKIT-GENERATOR-SMOKE-START
      - name: Generated project smoke test
        run: |
          uv run python scripts/new_project.py /tmp/primarykit-client --name client-backend --apps audit
          cd /tmp/primarykit-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users audit --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-storage-client --name storage-client --apps storage
          cd /tmp/primarykit-storage-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users storage organizations --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-inventory-client --name inventory-client --apps inventory
          cd /tmp/primarykit-inventory-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users catalog inventory organizations --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
          cd -
          uv run python scripts/new_project.py /tmp/primarykit-org-client --name org-client --apps organizations
          cd /tmp/primarykit-org-client
          uv sync --locked --all-groups
          uv run python manage.py makemigrations users organizations --noinput --settings=config.settings.test
          uv run python manage.py check --settings=config.settings.test
          uv run pytest
      # PRIMARYKIT-GENERATOR-SMOKE-END
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f compose.seaweedfs.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.seaweedfs.yaml config --quiet
      - name: Build Docker development and production images
        run: |
          docker compose build api
          docker build --target production -t primarykit:ci -f docker/Dockerfile .
      - name: PostgreSQL integration smoke test
        run: |
          docker compose up -d
          docker compose exec -T api python manage.py makemigrations users audit storage catalog inventory organizations --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py check
          docker compose exec -T api uv run pytest --ds=config.settings.postgres_test
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health/ready/
      - name: SeaweedFS S3 provider integration test
        run: |
          docker compose -f compose.yaml -f compose.seaweedfs.yaml up -d --no-build
          docker compose -f compose.yaml -f compose.seaweedfs.yaml exec -T -e PRIMARYKIT_SEAWEEDFS_INTEGRATION=1 api uv run pytest --ds=config.settings.postgres_test apps/storage/tests/test_seaweedfs_integration.py
      - name: Clean containers
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.seaweedfs.yaml down -v || true
          docker compose down -v || true
