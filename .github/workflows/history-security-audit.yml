name: Full History Secrets Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "13 3 * * 1"

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch branch, tag and pull-request refs
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git fetch --force origin '+refs/pull/*/head:refs/remotes/audit-pull/*'
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install verified Gitleaks 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$url" -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all fetched history without printing secrets
        run: |
          set -euo pipefail
          /tmp/gitleaks git --redact --no-banner --log-opts="--all" .
